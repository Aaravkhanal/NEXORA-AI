[project]
name = "nexus-intelligence-backend"
version = "1.0.0"
description = "Enterprise AI Company Intelligence Platform — Backend API"
authors = [{ name = "Nexus Intelligence", email = "dev@nexus-intelligence.ai" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sse-starlette>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "langchain-core>=0.3.0,<1.0",
    "langchain>=0.3.0,<1.0",
    "langchain-google-genai>=2.0,<3.0",
    "langchain-openai>=0.1.0,<1.0",
    "langchain-community>=0.3.0,<1.0",
    "langchain-chroma>=0.1,<1.0",
    "chromadb>=0.5,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<6.0",
    "feedparser>=6.0,<7.0",
    "yfinance>=0.2,<1.0",
    "python-dotenv>=1.0,<2.0",
    "tenacity>=8.0,<10.0",
    "aiohttp>=3.9,<4.0",
    "cachetools>=5.0,<6.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
